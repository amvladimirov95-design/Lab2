<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильный ввод данных</title>
    
    <!-- Подключение PWA-манифеста -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Настройки для мобильных браузеров (standalone режим и цвета) -->
    <meta name="theme-color" content="#007AFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Учет">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Индикатор синхронизации в углу -->
    <div id="sync-indicator" class="synced">✅ Готово</div>

    <div class="container">
        <h2>Ввод данных</h2>
        <form id="data-form">
            <input type="text" id="user-input" placeholder="Введите данные..." required autocomplete="off">
            <button type="submit">Отправить</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
