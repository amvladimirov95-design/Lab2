<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильный ввод данных</title>
    
    <link rel="manifest" href="manifest.json">
    
    <meta name="theme-color" content="#007AFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Учет">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sync-indicator" class="synced">✅ Готово</div>

    <div class="container">
        <h2>Ввод данных</h2>
        <form id="data-form">
            <select id="category-select" required>
                <option value="" disabled selected>Выберите категорию</option>
                <option value="Кат1">Кат1</option>
                <option value="Кат2">Кат2</option>
                <option value="Кат3">Кат3</option>
                <option value="Кат4">Кат4</option>
                <option value="Кат5">Кат5</option>
                <option value="Кат6">Кат6</option>
                <option value="Кат7">Кат7</option>
                <option value="Кат8">Кат8</option>
                <option value="Кат9">Кат9</option>
                <option value="Кат10">Кат10</option>
            </select>
            <input type="text" id="user-input" placeholder="Введите данные..." required autocomplete="off">
            <button type="submit">Отправить</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
